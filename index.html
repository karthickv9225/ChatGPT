<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 3C8.8203 3 3 8.8203 3 16C3 23.1797 8.8203 29 16 29C23.1797 29 29 23.1797 29 16C29 8.8203 23.1797 3 16 3ZM16 5C22.0989 5 27 9.90111 27 16C27 22.0989 22.0989 27 16 27C9.90111 27 5 22.0989 5 16C5 9.90111 9.90111 5 16 5Z" fill="currentColor"/>
                        <path d="M16 8L12.5 10.5V15.5L16 18L19.5 15.5V10.5L16 8Z" fill="currentColor"/>
                        <path d="M12.5 16.5L9 19V24L12.5 26.5L16 24V19L12.5 16.5Z" fill="currentColor"/>
                        <path d="M19.5 16.5L16 19V24L19.5 26.5L23 24V19L19.5 16.5Z" fill="currentColor"/>
                    </svg>
                    <h2>ChatGPT</h2>
                </div>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                New chat
            </button>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3 class="section-title">Previous Conversations</h3>
                    <div id="recentChats" class="recent-chats">
                        <p class="empty-text">No previous conversations</p>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="chat-header">
                <h2 class="chat-title">Current Conversation</h2>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <h1>What's on the agenda today?</h1>
                </div>
                
                <div class="messages" id="messages"></div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <button class="attach-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Ask ChatGPT" 
                        autocomplete="off"
                    />
                    <button class="think-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 1v6m0 6v6m5.66-13.66l-4.24 4.24m0 6.84l4.24 4.24M23 12h-6m-6 0H1m18.66 5.66l-4.24-4.24m0-6.84l4.24-4.24"></path>
                        </svg>
                        Think
                    </button>
                    <button class="send-btn" id="sendBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 16 16 12 12 8"></polyline>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
